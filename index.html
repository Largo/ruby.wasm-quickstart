<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby.wasm quickstart</title>
    <script src="browser.script.iife.js"></script>
    <style>
        body {
            background: #212121;
            font-size: 30px;
            color: whitesmoke;
            padding: 20px;
        }
        a, a:link,  a:visited {
            color: #FF0000;
        }
        .examples a, .examples a:link, .examples a:visited {
            display: block;
            color: #FF0000;
            margin: 20px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
          }
        
          @keyframes spin {
            0% {
              transform: rotate(0deg);
            }
            100% {
              transform: rotate(360deg);
            }
          }
    </style>
</head>
<body>
    <h1>Ruby.wasm Quickstart</h1>
    <div id="spinner" class="spinner"></div>
    <script type="text/ruby" data-eval="async">
        require "/gems/setup"
        require 'kramdown'
        # Read JS properties with [:name], call JS methods like Ruby methods.
        $d = JS.global[:document]

        $d.getElementById("spinner")[:style][:display] = "none"

        # Small helper: create an element, set properties, append it to a parent.
        def add_element(parent, tag, **props)
            element = $d.createElement(tag)
            props.each { |name, value| element[name] = value }
            parent.appendChild(element)
            element
        end

        add_element($d[:body], "h2", innerText: "Examples")

        examplesDiv = add_element($d[:body], "div", className: "examples")
        examples = %w(run-code shoppingList require canvas heartbeat kramdown)
        examples.each do |example|
            add_element(examplesDiv, "a", href: "#{example}.html", innerText: example)
        end

        response = JS.global.fetch("README.md").await
        if response[:status].to_i == 200
            readmeMarkdown = response.text.await.to_s
            add_element($d[:body], "div",
                        className: "explanation",
                        innerHTML: Kramdown::Document.new(readmeMarkdown).to_html)
        end
    </script>
</body>
</html>
